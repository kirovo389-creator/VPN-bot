name: Validate demo project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Smoke test database and API
        run: |
          python - <<'PY'
          import database
          import api
          database.init_db()
          assert api.health()["ok"] is True
          print("Database and API import checks passed")
          PY
